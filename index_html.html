<title>Go Talleres</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral negra con el logo + área de trabajo clara; en móvil la navegación pasa a una fila de pestañas desplazable */
:root{
  --ink:#141414; --ink-2:#2a2827; --paper:#f6f4f2; --card:#ffffff; --line:#e4dfdb; --muted:#6f6964;
  --red:#e2362b; --red-soft:#fde8e6; --red-ink:#b3241b;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6200; --warn-soft:#fff1d6;
  --side:#141414; --side-fg:#f6f4f2; --side-muted:#a39d98;
  --f-display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#f3f0ed; --ink-2:#d8d3cf; --paper:#121111; --card:#1c1a19; --line:#33302e; --muted:#a39d98;
  --red:#f0473b; --red-soft:#3a1715; --red-ink:#ff8a80;
  --ok:#5fd39a; --ok-soft:#14301f; --warn:#f2b54a; --warn-soft:#352812;
  --side:#0a0a0a; --side-fg:#f3f0ed; --side-muted:#8f8984; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#f3f0ed; --ink-2:#d8d3cf; --paper:#121111; --card:#1c1a19; --line:#33302e; --muted:#a39d98;
  --red:#f0473b; --red-soft:#3a1715; --red-ink:#ff8a80;
  --ok:#5fd39a; --ok-soft:#14301f; --warn:#f2b54a; --warn-soft:#352812;
  --side:#0a0a0a; --side-fg:#f3f0ed; --side-muted:#8f8984; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--side);color:var(--side-fg);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand img{width:56px;height:56px;border-radius:12px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1}
.brand small{display:block;color:var(--side-muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--side-muted);font-weight:600}
nav button:hover{color:var(--side-fg);background:#ffffff10}
nav button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
nav button[aria-current="page"]{color:var(--side-fg);background:#ffffff14;box-shadow:inset 3px 0 0 var(--red)}
nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding-inline:6px;display:flex;flex-direction:column;gap:6px}
.side-foot button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;line-height:1.2}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi.alert .v{color:var(--red)}
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--line);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--red-soft);color:var(--red-ink)}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{font-weight:700}
.empty{color:var(--muted);padding:12px 0}
/* horario semanal */
.week{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.day h3{margin:0 0 8px;font-family:var(--f-display);font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.day h3 span{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600}
.day.today h3{color:var(--red)}
.slot{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--red));border-radius:10px;padding:8px 10px;margin-bottom:8px}
.slot:hover{border-color:var(--ink);border-left-color:var(--c,var(--red))}
.slot:focus-visible{outline:2px solid var(--red)}
.slot .h{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slot .n{font-weight:700;line-height:1.25}
.slot .p{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.fam .panel{display:flex;flex-direction:column;gap:10px}
.kid{display:flex;justify-content:space-between;gap:10px;padding:10px;border-radius:10px;background:var(--paper)}
.kid .t{font-weight:700}
.kid .d{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.taller .price{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.taller{display:flex;flex-direction:column;gap:8px}
.taller .row{margin-top:auto}
.search{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-width:0;width:240px;max-width:100%}
/* modal */
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:#0009}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f .lbl{font-size:13px;font-weight:700}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600;cursor:pointer}
.preview{background:var(--paper);border-radius:12px;padding:12px 14px}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--paper)}
/* documento (boleta / cotización) */
.doc{background:#fff;color:#141414;border:1px solid #ddd;border-radius:12px;padding:20px;font-size:14px}
.doc .dh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.doc .dh img{width:64px;height:64px;border-radius:10px}
.doc .box{border:2px solid #141414;border-radius:8px;padding:8px 14px;text-align:center;font-weight:700}
.doc .box .s{font-family:var(--f-mono);color:#e2362b;font-size:15px}
.doc table{font-size:13px;margin-top:12px}
.doc th{color:#555;border-color:#ddd}
.doc td{border-color:#eee}
.doc .tot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:10px;font-variant-numeric:tabular-nums}
.doc .tot b{font-size:18px}
.doc .note{color:#666;font-size:12px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--red-soft);color:var(--red-ink);border-radius:10px;padding:8px 12px;font-weight:600}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside,nav{min-width:0}
  aside{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;padding-block:10px;flex-direction:row;align-items:center;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .brand b,.brand small,.side-foot{display:none}
  .brand img{width:40px;height:40px}
  nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none}
  nav button{padding:8px 10px;white-space:nowrap;font-size:14px}
  nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--red)}
  h1{font-size:28px}
  .fgrid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:420px){.grid2,.fam,.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
const LOGO = document.querySelector('.brand img').src;
const KEY = 'gotalleres.v1';
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const COLORS = ['#e2362b','#2b6fe2','#1f9d6a','#c27a00','#8a4fd1','#d1407f','#1a8fa3'];
const DISTRITOS = {'Miraflores':40,'San Isidro':40,'Barranco':45,'Surco':50,'San Borja':45,'La Molina':70,'Jesús María':40,'Lince':35,'Magdalena':40,'Pueblo Libre':40,'San Miguel':50,'Chorrillos':60,'Los Olivos':80,'San Juan de Lurigancho':90,'Callao':80,'Ate':80,'Otro':100};
const TIPOS_EVENTO = ['Cumpleaños infantil','Baby shower','Evento de colegio','Evento corporativo','Matrimonio','Fiesta familiar','Otro'];
const SHOWS = {'Animación infantil':180,'Show de títeres':200,'Show de magia':220,'Show musical':250,'Pintacaritas':120,'Mimos y estatuas vivientes':160,'Taller de arte en el evento':170};
const CATS = ['Vestuario','Equipos','Mobiliario','Electro'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = (n) => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return iso(d); };
const periodo = (d=TODAY) => d.getFullYear()+'-'+pad(d.getMonth()+1);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soles = n => 'S/ ' + Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fechaL = s => { if(!s) return '—'; const d=parseD(s); return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+' '+d.getFullYear(); };
const periodoL = p => { const [y,m]=p.split('-'); return MESES[+m-1][0].toUpperCase()+MESES[+m-1].slice(1)+' '+y; };
const edad = s => { const b=parseD(s); let a=TODAY.getFullYear()-b.getFullYear(); const m=TODAY.getMonth()-b.getMonth(); if(m<0||(m===0&&TODAY.getDate()<b.getDate())) a--; return a; };
const cumple = s => { const b=parseD(s); return b.getDate()+' de '+MESES[b.getMonth()]; };
const diasParaCumple = s => { const b=parseD(s); let n=new Date(TODAY.getFullYear(),b.getMonth(),b.getDate()); if(n<TODAY) n.setFullYear(n.getFullYear()+1); return Math.round((n-TODAY)/864e5); };
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const fromMin = m => pad(Math.floor(m/60)%24)+':'+pad(m%60);
const horasEntre = (a,b) => { let d=toMin(b)-toMin(a); if(d<=0) d+=1440; return d/60; };
const hrs = n => (Math.round(n*10)/10).toString().replace('.',',')+' h';

/* ---------- formularios ---------- */
const dlg = document.getElementById('dlg'), dlgc = document.getElementById('dlgc');
let formCtx = null;
function field(f, v){
  const id='f_'+f.k; const full = f.full?' full':'';
  if(f.type==='select') return `<div class="f${full}"><label for="${id}">${f.label}</label><select id="${id}" name="${f.k}">${f.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select></div>`;
  if(f.type==='checks') return `<div class="f full"><span class="lbl">${f.label}</span><div class="checks">${f.options.map(([val,lab])=>`<label><input type="checkbox" name="${f.k}" value="${esc(val)}" ${(v||[]).map(String).includes(String(val))?'checked':''}>${esc(lab)}</label>`).join('')}</div></div>`;
  if(f.type==='textarea') return `<div class="f full"><label for="${id}">${f.label}</label><textarea id="${id}" name="${f.k}">${esc(v)}</textarea></div>`;
  return `<div class="f${full}"><label for="${id}">${f.label}</label><input id="${id}" name="${f.k}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} ${f.req?'required':''} value="${esc(v)}"></div>`;
}
function readForm(){
  const o={}; formCtx.fields.forEach(f=>{
    if(f.type==='checks') o[f.k]=[...dlgc.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>f.num?Number(i.value):i.value);
    else { const el=dlgc.querySelector(`[name="${f.k}"]`); o[f.k]= f.type==='number'?Number(el.value||0):el.value.trim(); }
  }); return o;
}
function openForm({title, fields, values={}, onSave, onDelete, preview, saveLabel='Guardar'}){
  formCtx = {fields,onSave,onDelete,preview,confirmDel:false};
  dlgc.innerHTML = `<form id="frm" class="dlg" novalidate><div class="dlg-h"><h2>${title}</h2><button type="button" class="x" data-a="close" aria-label="Cerrar">×</button></div>
  <div class="dlg-b"><div class="fgrid">${fields.map(f=>field(f, values[f.k] ?? f.def ?? '')).join('')}</div>${preview?'<div class="preview" id="pv"></div>':''}<div id="ferr" class="confirm" hidden></div></div>
  <div class="dlg-f">${onDelete?'<button type="button" class="btn ghost" data-a="del" style="margin-right:auto">Eliminar</button>':''}<button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn primary" type="submit">${saveLabel}</button></div></form>`;
  if(!dlg.open) dlg.showModal();
  updPreview();
}
function updPreview(){ if(formCtx?.preview){ const pv=document.getElementById('pv'); if(pv) pv.innerHTML=formCtx.preview(readForm()); } }
function showDoc(title, html, actions=''){
  formCtx=null;
  dlgc.innerHTML = `<div class="dlg-h"><h2>${title}</h2><button type="button" class="x" data-a="close" aria-label="Cerrar">×</button></div><div class="dlg-b">${html}</div><div class="dlg-f">${actions}<button type="button" class="btn primary" data-a="close">Listo</button></div>`;
  if(!dlg.open) dlg.showModal();
}
dlgc.addEventListener('input', updPreview);
dlgc.addEventListener('change', updPreview);
dlgc.addEventListener('submit', e=>{
  e.preventDefault(); const v=readForm(); const err=formCtx.onSave(v);
  if(err){ const fe=document.getElementById('ferr'); fe.textContent=err; fe.hidden=false; return; }
  save(); if(formCtx && formCtx._keepOpen){ formCtx._keepOpen=false; } else dlg.close(); render();
});

  openForm({title:'Registrar pago', fields:F_PAGO(), values:{alumnoId:a?.id, monto:a?mensualidad(a):0}, saveLabel:'Registrar pago',

    onSave:v=>{ if(!alumno(v.alumnoId)) return 'Primero registra un alumno en la sección Alumnos.'; if(!v.monto) return 'Ingresa el monto del pago.'; const p={id:uid(),alumnoId:v.alumnoId,periodo:v.periodo,fecha:v.fecha,monto:v.monto,metodo:v.metodo,boleta:null};
      if(v.emitir==='si') p.boleta = nuevaBoleta(); S.pagos.push(p); save(); toast('Pago registrado');
      if(p.boleta){ formCtx._keepOpen=true; setTimeout(()=>verBoleta(p.id),0); } }});
  // al cambiar alumno, actualizar monto sugerido
  const sel = dlgc.querySelector('[name="alumnoId"]'); sel.addEventListener('change',()=>{ const al=alumno(sel.value); if(al) dlgc.querySelector('[name="monto"]').value=mensualidad(al); updPreview(); });
}
const nuevaBoleta = () => S.serie+'-'+String(S.correlativo++).padStart(8,'0');
function verBoleta(pid){
  const p = S.pagos.find(x=>x.id===pid); const a = alumno(p.alumnoId); const f=a?.familia||{};
  const gravada = p.monto/1.18, igv = p.monto-gravada;
  showDoc('Boleta '+p.boleta, `<div class="doc">
    <div class="dh"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO}" alt=""><div><b style="font-size:16px">GO TALLERES</b><div style="color:#555;font-size:12px">Escuela de arte y shows infantiles<br>Lima, Perú</div></div></div>
    <div class="box">RUC 20XXXXXXXXX<br>BOLETA DE VENTA<br><span class="s">${p.boleta}</span></div></div>
    <div style="margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px">
      <span style="color:#555">Fecha de emisión</span><span>${fechaL(p.fecha)}</span>
      <span style="color:#555">Cliente</span><span>${esc(apoderado(f))}</span>
      <span style="color:#555">DNI</span><span>${esc(f.dni||'—')}</span>
      <span style="color:#555">Forma de pago</span><span>${esc(p.metodo)}</span></div>
    <table><thead><tr><th>Cant.</th><th>Descripción</th><th class="num">Importe</th></tr></thead><tbody>
      <tr><td>1</td><td>Mensualidad ${periodoL(p.periodo)} · ${esc(a?.nombre)}<br><span style="color:#666">${(a?.clases||[]).map(id=>esc(clase(id)?.nombre)).join(', ')}</span></td><td class="num">${soles(p.monto)}</td></tr></tbody></table>
    <div class="tot"><span>Op. gravada: ${soles(gravada)}</span><span>IGV (18%): ${soles(igv)}</span><b>Total: ${soles(p.monto)}</b></div>
    <div class="note">Comprobante interno de la app. Para que sea válido ante SUNAT, se debe emitir desde un sistema de facturación electrónica conectado (pendiente de configurar).</div></div>`,
    `<button type="button" class="btn" data-a="copiar-boleta" data-id="${p.id}">Copiar texto</button>`);
}
function cotDoc(q){
  const t=taller(q.tallerId); const total=(t?.costo||0)*q.cantidad;
  return `<div class="doc"><div class="dh"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO}" alt=""><div><b style="font-size:16px">GO TALLERES</b><div style="color:#555;font-size:12px">Cotización de taller · ${fechaL(q.fecha)}</div></div></div></div>
  <p style="margin:14px 0 4px"><b>Para:</b> ${esc(q.cliente)}<br><span style="color:#555">${esc(q.contacto)}</span></p>
  <table><thead><tr><th>Taller</th><th>Horario</th><th class="num">Cant.</th><th class="num">P. unit.</th><th class="num">Total</th></tr></thead><tbody>
  <tr><td>${esc(t?.nombre)}<br><span style="color:#666">${esc(t?.duracion)} · ${esc(t?.modalidad)}</span></td><td>${esc(q.horario||t?.horarios)}</td><td class="num">${q.cantidad}</td><td class="num">${soles(t?.costo)}</td><td class="num">${soles(total)}</td></tr></tbody></table>
  <div class="tot"><b>Total: ${soles(total)}</b><span style="color:#666">Precios incluyen IGV</span></div>
  <div class="note">Cotización válida por 15 días. Incluye materiales y profesor(a) a cargo.</div></div>`;
}
function eventoDoc(e){
  const t=totalEvento(e);
  return `<div class="doc"><div class="dh"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO}" alt=""><div><b style="font-size:16px">GO TALLERES</b><div style="color:#555;font-size:12px">Cotización de evento</div></div></div><div class="box">${esc(e.estado).toUpperCase()}</div></div>
  <div style="margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px">
    <span style="color:#555">Contrata</span><span>${esc(e.cliente)} · ${esc(e.telefono)}</span>
    <span style="color:#555">Evento</span><span>${esc(e.tipo)}</span>
    <span style="color:#555">Fecha</span><span>${e.fecha?DIAS_L[parseD(e.fecha).getDay()]+' '+fechaL(e.fecha):'Por definir'}</span>
    <span style="color:#555">Horario</span><span>${e.inicio} a ${e.fin} (${hrs(horasEvento(e))})</span>
    <span style="color:#555">Distrito</span><span>${esc(e.distrito)}</span></div>
  <table><thead><tr><th>Concepto</th><th class="num">Detalle</th><th class="num">Importe</th></tr></thead><tbody>
    <tr><td>${esc(e.show)}</td><td class="num">${hrs(horasEvento(e))} × ${soles(SHOWS[e.show])}</td><td class="num">${soles(t.base)}</td></tr>
    <tr><td>Movilidad a ${esc(e.distrito)}</td><td class="num"></td><td class="num">${soles(t.mov)}</td></tr></tbody></table>
  <div class="tot"><b>Total: ${soles(t.total)}</b>${e.adelanto?`<span>Adelanto: ${soles(e.adelanto)} · Saldo: ${soles(t.total-e.adelanto)}</span>`:'<span style="color:#666">Se separa la fecha con 50% de adelanto</span>'}</div>
  ${e.nota?`<div class="note">${esc(e.nota)}</div>`:''}</div>`;
}
function eventoForm(id){
  crud('eventos',F_EVENTO,'evento',id,{values:{fecha:addDays(7),distrito:'Surco'},validate:req('cliente','fecha'),
    preview:v=>{ if(!v.inicio||!v.fin) return ''; const t=totalEvento(v); return `<div class="eyebrow">Cotización</div><b>${hrs(horasEvento(v))}</b> de ${esc(v.show)} (${soles(SHOWS[v.show])}/h) = ${soles(t.base)}<br>Movilidad ${esc(v.distrito)}: ${soles(t.mov)}<div style="font-family:var(--f-display);font-size:24px;font-weight:800;margin-top:4px">Total ${soles(t.total)}</div>`; }});
}
function textoBoleta(p){ const a=alumno(p.alumnoId); return `GO TALLERES · Boleta ${p.boleta}\nFecha: ${fechaL(p.fecha)}\nCliente: ${apoderado(a?.familia||{})}\nMensualidad ${periodoL(p.periodo)} · ${a?.nombre}\nTotal: ${soles(p.monto)} (${p.metodo})`; }

/* ---------- acciones ---------- */
const A = {
  close:()=>dlg.close(),
  del:()=>{ if(!formCtx.confirmDel){ formCtx.confirmDel=true; const fe=document.getElementById('ferr'); fe.innerHTML='¿Seguro? Vuelve a pulsar Eliminar para confirmar.'; fe.hidden=false; return; } formCtx.onDelete(); save(); dlg.close(); render(); },
  'prof-nuevo':()=>crud('profesores',F_PROF,'profesor',null,{validate:req('nombre')}),
  'prof-editar':id=>crud('profesores',F_PROF,'profesor',id,{validate:req('nombre')}),
  'clase-nueva':()=>crud('clases',F_CLASE,'clase',null,{validate:v=>req('nombre')(v)||(!v.dias.length?'Elige al menos un día.':null)}),
  'clase-editar':id=>crud('clases',F_CLASE,'clase',id,{validate:v=>req('nombre')(v)||(!v.dias.length?'Elige al menos un día.':null)}),
  'clase-ver':id=>{ const c=clase(id); const al=alumnosDe(id);
    showDoc(esc(c.nombre), `<div class="muted">${esc(prof(c.profesorId)?.nombre)} · ${c.dias.map(d=>DIAS_L[d]).join(' y ')} · ${c.inicio}–${fromMin(toMin(c.inicio)+c.horas*60)} (${hrs(c.horas)}) · ${esc(c.salon)} · ${esc(c.edad)}</div>
      <h2 style="font-size:17px">Asisten ${al.length} alumno(s)</h2><div class="list">${al.map(a=>`<div class="li"><div><div class="t">${esc(a.nombre)}</div><div class="muted" style="font-size:13px">${edad(a.nacimiento)} años · ${esc(apoderado(a.familia))} · ${esc(a.familia.telefono)}</div></div>${pagoDe(a.id,periodo())?pill('Pagado','ok'):pill('Pendiente','bad')}</div>`).join('')||'<div class="empty">Sin alumnos inscritos.</div>'}</div>`,
      `<button type="button" class="btn" data-a="clase-editar" data-id="${id}">Editar clase</button>`); },
  'familia-nueva':()=>crud('familias',F_FAM,'familia',null,{values:{hijos:[],distrito:'Surco'},validate:v=>(!v.madre&&!v.padre)?'Escribe el nombre de al menos uno de los padres.':null}),
  'familia-editar':id=>crud('familias',F_FAM,'familia',id,{validate:v=>(!v.madre&&!v.padre)?'Escribe el nombre de al menos uno de los padres.':null}),
  'hijo-nuevo':fid=>{ const f=S.familias.find(x=>x.id===fid);
    openForm({title:'Agregar hijo a '+esc(apoderado(f)), fields:F_HIJO(), values:{}, onSave:v=>{ if(!v.nombre||!v.nacimiento) return 'Completa el nombre y la fecha de nacimiento.'; f.hijos.push({id:uid(),...v}); toast('Alumno registrado'); }}); },
  'hijo-editar':hid=>{ const f=S.familias.find(x=>x.hijos.some(h=>h.id===hid)); const h=f.hijos.find(x=>x.id===hid);
    openForm({title:'Editar alumno', fields:F_HIJO(), values:h, onSave:v=>{ if(!v.nombre||!v.nacimiento) return 'Completa el nombre y la fecha de nacimiento.'; Object.assign(h,v); toast('Cambios guardados'); },
      onDelete:()=>{ f.hijos=f.hijos.filter(x=>x.id!==hid); toast('Alumno eliminado'); }}); },
  'pago-nuevo':()=>pagoForm(),
  cobrar:id=>pagoForm(id),
  'boleta-ver':verBoleta,
  'boleta-emitir':id=>{ const p=S.pagos.find(x=>x.id===id); p.boleta=nuevaBoleta(); save(); render(); verBoleta(id); toast('Boleta '+p.boleta+' emitida'); },
  'copiar-boleta':id=>{ const txt=textoBoleta(S.pagos.find(x=>x.id===id)); try{ navigator.clipboard.writeText(txt).then(()=>toast('Texto copiado'),()=>toast('No se pudo copiar')); }catch(e){ toast('No se pudo copiar'); } },
  'taller-nuevo':()=>crud('talleres',F_TALLER,'taller',null,{validate:req('nombre')}),
  'taller-editar':id=>crud('talleres',F_TALLER,'taller',id,{validate:req('nombre')}),
  'cot-nueva':tid=>crud('cotTalleres',F_COT,'cotización de taller',null,{values:{tallerId:tid||S.talleres[0]?.id,horario:taller(tid||S.talleres[0]?.id)?.horarios||''},validate:v=>req('cliente')(v)||(!taller(v.tallerId)?'Primero crea un taller en el catálogo.':null),
     preview:v=>{const t=taller(v.tallerId); return `${v.cantidad} × ${soles(t?.costo)} ${esc(t?.modalidad)}<div style="font-family:var(--f-display);font-size:24px;font-weight:800">Total ${soles((t?.costo||0)*v.cantidad)}</div>`;}}),
  'cot-editar':id=>crud('cotTalleres',F_COT,'cotización de taller',id,{validate:req('cliente'),preview:v=>{const t=taller(v.tallerId); return `<div style="font-family:var(--f-display);font-size:24px;font-weight:800">Total ${soles((t?.costo||0)*v.cantidad)}</div>`;}}),
  'cot-ver':id=>showDoc('Cotización de taller', cotDoc(S.cotTalleres.find(q=>q.id===id))),
  'evento-nuevo':()=>eventoForm(null),
  'evento-editar':id=>eventoForm(id),
  'evento-ver':id=>{ const e=S.eventos.find(x=>x.id===id); showDoc('Cotización de evento', eventoDoc(e), e.estado==='Cotizado'?`<button type="button" class="btn" data-a="evento-confirmar" data-id="${id}">Marcar como confirmado</button>`:''); },
  'evento-confirmar':id=>{ S.eventos.find(x=>x.id===id).estado='Confirmado'; save(); dlg.close(); render(); toast('Evento confirmado y agendado'); },
  'ev-filtro':x=>{ ui.evFiltro=x; render(); },
  'inv-cat':x=>{ ui.invCat=x; render(); },
  'item-nuevo':()=>crud('inventario',F_ITEM,'artículo',null,{values:{categoria:ui.invCat!=='Todas'?ui.invCat:'Vestuario'},validate:req('nombre')}),
  'item-editar':id=>crud('inventario',F_ITEM,'artículo',id,{validate:req('nombre')}),
  vaciar:()=>{ const bs=document.querySelectorAll('[data-a="vaciar"]'); if(!ui.confirmVaciar){ ui.confirmVaciar=true; bs.forEach(b=>b.textContent='¿Seguro? Pulsa otra vez para borrar'); setTimeout(()=>{ui.confirmVaciar=false; bs.forEach(b=>b.textContent='Borrar datos de demostración');},4000); return; }
    ui.confirmVaciar=false; bs.forEach(b=>b.textContent='Borrar datos de demostración');
    S={demo:false,profesores:[],clases:[],familias:[],pagos:[],talleres:[],cotTalleres:[],eventos:[],inventario:[],serie:'B001',correlativo:1,precioMovilidad:{...DISTRITOS}}; save(); render(); toast('Listo, la app está vacía para tus datos reales'); },
  reset:()=>{ const b=document.querySelector('[data-a="reset"]'); if(!ui.confirmReset){ ui.confirmReset=true; b.textContent='¿Reemplazar todo por la demostración? Pulsa otra vez'; setTimeout(()=>{ui.confirmReset=false; b.textContent='Cargar datos de demostración';},4000); return; }
    ui.confirmReset=false; b.textContent='Cargar datos de demostración'; S=seed(); save(); render(); toast('Datos de demostración cargados'); },
};
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ if(dlg.open) dlg.close(); go(g.dataset.go); return; }
  const b = e.target.closest('[data-a]'); if(!b) return;
  const fn = A[b.dataset.a]; if(fn){ e.preventDefault(); fn(b.dataset.id); }
});
document.addEventListener('input', e=>{ if(e.target.id==='q'){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); } });
render();
})();
</script>
